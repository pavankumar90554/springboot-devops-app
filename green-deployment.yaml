apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-green
  template:
    metadata:
      labels:
        app: springboot-green
    spec:
      containers:
      - name: springboot-app
        image: pavankumar213/springboot:14
        ports:
        - containerPort: 8080
