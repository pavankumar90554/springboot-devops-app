apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-blue
  template:
    metadata:
      labels:
        app: springboot-blue
    spec:
      containers:
      - name: springboot-app
        image: pavankumar213/springboot:13
        ports:
        - containerPort: 8080
